[project]
name = "ai-intelligence-pipeline"
version = "0.1.0"
description = "A Python pipeline for collecting, processing, and validating AI research, repositories, products, and startups."
readme = "README.md"
authors = [
    { name = "Guru", email = "guruarunachalam17@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
]



[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
